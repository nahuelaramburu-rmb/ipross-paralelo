
plugins {
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.5'
    id 'java'
    id 'idea'
    id 'jacoco'
    id 'org.asciidoctor.jvm.convert' version '3.3.2'
    id 'de.undercouch.download' version '5.6.0'
}

group = 'com.capacidad.identityservice'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot starters
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-undertow"
    implementation "org.springframework.boot:spring-boot-starter-hateoas"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-mail"
    implementation "org.springframework.boot:spring-boot-starter-thymeleaf"
    implementation "org.springframework.boot:spring-boot-starter-data-redis"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-validation"

    runtimeOnly 'org.springframework.boot:spring-boot-devtools'

    // Spring Security OAuth2 / JWT
    implementation "org.springframework.security:spring-security-oauth2-jose"
    implementation "org.springframework.boot:spring-boot-starter-oauth2-resource-server"
    implementation "org.springframework.security:spring-security-oauth2-authorization-server"
    implementation "org.springframework.security:spring-security-messaging"
    implementation "org.springframework:spring-messaging"

    // swaggger , open-api
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'


    // para generar pdf , a partir de swagger
    // Swagger2Markup para convertir el JSON/YAML de OpenAPI
//    implementation 'io.github.swagger2markup:swagger2markup:1.3.3'
//    implementation 'io.github.swagger2markup:swagger2markup-cli:1.3.3'
    // Para generar PDF desde Asciidoc
    implementation 'org.asciidoctor:asciidoctorj:2.5.3'
    implementation 'org.asciidoctor:asciidoctorj-pdf:1.5.3'


    // Base de datos y utilidades
    implementation 'org.flywaydb:flyway-core:11.12.0'
    implementation 'org.flywaydb:flyway-database-postgresql:11.12.0'

    implementation "org.apache.commons:commons-pool2:2.6.2"
    implementation "com.warrenstrange:googleauth:1.5.0"

    implementation 'org.postgresql:postgresql:42.7.7'

    //   implementation 'mysql:mysql-connector-java:8.0.33'

    implementation "org.modelmapper:modelmapper:2.3.5"
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'org.json:json:20231013'


    // JJWT (JSON Web Tokens)
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5' // para soporte con Jackson

    // Lombok
    compileOnly "org.projectlombok:lombok:1.18.30"
    annotationProcessor "org.projectlombok:lombok:1.18.30"
    testCompileOnly "org.projectlombok:lombok:1.18.30"
    testAnnotationProcessor "org.projectlombok:lombok:1.18.30"

    //  Test dependencies (usando BOM para unificar versiones)
    testImplementation(platform("org.junit:junit-bom:5.10.0"))
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'

    testImplementation 'org.mockito:mockito-core:5.5.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.5.0'
    testImplementation 'org.assertj:assertj-core:3.24.2'

    // Starter de test de Spring Boot, pero EXCLUYENDO JUnit 4 y libs viejas
    testImplementation("org.springframework.boot:spring-boot-starter-test") {
        exclude group: "junit", module: "junit"
        exclude group: "org.mockito", module: "mockito-core"
        exclude group: "org.assertj", module: "assertj-core"
    }

    // Librerías locales
    implementation fileTree(include: ['utils-1.0-SNAPSHOT.jar'], dir: 'libs')
}


tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// ----------------------------------------------------------
// 1️⃣ Descargar JAR de OpenAPI Generator
// ----------------------------------------------------------
def openApiGeneratorVersion = '7.6.0'
def openApiGeneratorJar = file("$buildDir/openapi-generator-cli-${openApiGeneratorVersion}.jar")

tasks.register('downloadOpenApiGenerator', de.undercouch.gradle.tasks.download.Download) {
    description = "Descarga el CLI de OpenAPI Generator (${openApiGeneratorVersion})"
    src "https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/${openApiGeneratorVersion}/openapi-generator-cli-${openApiGeneratorVersion}.jar"
    dest openApiGeneratorJar
    onlyIfModified true
}

// ----------------------------------------------------------
// 2️⃣ Generar AsciiDoc desde OpenAPI JSON
// ----------------------------------------------------------
tasks.register('generateAsciiDocs', Exec) {
    dependsOn 'downloadOpenApiGenerator'
    description = 'Convierte el JSON de OpenAPI a AsciiDoc usando openapi-generator-cli'

    def jsonFile = "$buildDir/openapi.json"
    def outputDir = "$buildDir/docs/asciidoc"

    doFirst {
        println "🔍 Descargando OpenAPI JSON desde http://localhost:8080/v3/api-docs ..."
        new URL("http://localhost:8080/identity-service/v1/v3/api-docs").withInputStream { i ->
            new File(jsonFile).withOutputStream { it << i }
        }
    }

    commandLine 'java', '-jar', openApiGeneratorJar,
            'generate',
            '-i', jsonFile,
            '-g', 'asciidoc',
            '-o', outputDir

    doLast {
        println "✅ Archivos AsciiDoc generados en: $outputDir"
    }
}

// ----------------------------------------------------------
// 3️⃣ Convertir AsciiDoc → PDF con Asciidoctor
// ----------------------------------------------------------
tasks.named('asciidoctor', org.asciidoctor.gradle.jvm.AsciidoctorTask) {
    dependsOn 'generateAsciiDocs'

    sourceDir = file("$buildDir/docs/asciidoc")
    outputDir = file("$buildDir/docs/pdf")

    attributes(
            'backend': 'pdf',  // <- esto es lo clave
            'doctype': 'book',
            'toc': 'left',
            'numbered': '',
            'sectanchors': '',
            'sectlinks': '',
            'pdf-theme': file('src/docs/pdf-theme.yml')
    )

    doFirst {
        println "📄 Generando PDF desde AsciiDoc..."
    }
}


// ----------------------------------------------------------
// 4️⃣ Tarea final combinada
// ----------------------------------------------------------
tasks.register('generateApiPdf') {
    group = 'documentation'
    description = 'Genera PDF completo de la documentación OpenAPI'
    dependsOn 'asciidoctor'
    doLast {
        println "📄 PDF generado en: build/docs/pdf/index.pdf"
    }
}



jacocoTestReport {
    reports {
        xml.required.set(false)
        csv.required.set(false)
        html.outputLocation.set(layout.buildDirectory.dir("jacocoHtml"))
    }
    getClassDirectories().setFrom(classDirectories.files.collect {
        fileTree(dir: it, exclude: [
                'com/capacidad/identityservice/config/oauth/**',
                'com/capacidad/identityservice/config/security/**',
                'com/capacidad/identityservice/functional/**',
                'com/capacidad/identityservice/model/**',
                'com/capacidad/identityservice/exception/**',
                'com/capacidad/identityservice/repository/**',
                'com/capacidad/identityservice/service/impl/**',
                'com/capacidad/identityservice/specification/**'
        ])
    })
}

// Configuración de tests
test {
    useJUnitPlatform() // Muy importante para detectar JUnit 5
    testLogging {
        events "passed", "skipped", "failed"
    }
}
