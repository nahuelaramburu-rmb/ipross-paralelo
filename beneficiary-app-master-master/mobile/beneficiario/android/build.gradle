// Top-level build        classpath("com.android.tools.build:gradle:8.7.3")file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        minSdkVersion = 21
        compileSdkVersion = 35
        targetSdkVersion = 35
        supportLibVersion = "28.0.0"
        layServicesVersion = "17.0.0" // or find latest version
        kotlinVersion = "1.9.22"
        ndkVersion = "27.1.12297006"
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath('com.android.tools.build:gradle:8.13.0')
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath 'com.google.gms:google-services:4.4.0'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { 
            url = 'https://www.jitpack.io' 
        }
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url = "$rootDir/../node_modules/react-native/android"
            name = "React Native"
        }
        maven {
            // Android JSC is installed from npm
            url = "$rootDir/../node_modules/jsc-android/dist"
            name = "JSC"
        }
        mavenLocal()
    }
}

subprojects {
    afterEvaluate {project ->
        if (project.hasProperty("android")) {
            android {
                compileSdkVersion = 35
                
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
    }
}

// Modern Gradle 9.0 configuration
gradle.projectsEvaluated {
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
    }
}

// Enable build features for modern AGP
if (project.hasProperty("android")) {
    android {
        buildFeatures {
            buildConfig = true
        }
    }
}
