// Top-level build        classpath("com.android.tools.build:gradle:7.4.2")file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        minSdkVersion = 21
        compileSdkVersion = 33
        targetSdkVersion = 33
        supportLibVersion = "28.0.0"
        layServicesVersion = "17.0.0" // or find latest version
        kotlinVersion = "1.7.22"
        ndkVersion = "23.1.7779620"
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath('com.android.tools.build:gradle:7.4.2')
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath 'com.google.gms:google-services:4.4.0'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { 
            url = 'https://www.jitpack.io' 
        }
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url = "$rootDir/../node_modules/react-native/android"
            name = "React Native"
        }
        maven {
            // Android JSC is installed from npm
            url = "$rootDir/../node_modules/jsc-android/dist"
            name = "JSC"
        }
        mavenLocal()
    }
}

subprojects {
    afterEvaluate {project ->
        if (project.hasProperty("android")) {
            android {
                compileSdkVersion = 33
                // buildToolsVersion "34.0.0" // Removed as suggested by Android Gradle Plugin 8.11.0
                
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
    }
}
