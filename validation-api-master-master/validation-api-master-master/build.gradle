buildscript {
    ext {
        lombokVersion = '1.18.12'
        awsSdkVersion = '1.11.756'
        flyingSaucerRendererVersion = '9.1.20'
    }
}

plugins {
    id 'org.springframework.boot' version '2.2.6.RELEASE'
    id 'java'
    id 'idea'
    id 'jacoco'
    id "io.spring.dependency-management" version '1.0.8.RELEASE'
}

bootJar {
    archiveBaseName = 'validation-api'
    archiveVersion = '0.0.1-SNAPSHOT'
}

sourceCompatibility = '11'

repositories {
    mavenCentral()
}

dependencies {
    implementation('org.springframework.boot:spring-boot-starter-data-jpa')
    implementation('org.springframework.boot:spring-boot-starter-hateoas')
    implementation('org.springframework.boot:spring-boot-starter-web')
    implementation("org.springframework.boot:spring-boot-starter-security")
    implementation("org.springframework.boot:spring-boot-starter-actuator")
    implementation("org.springframework.boot:spring-boot-starter-websocket")
    implementation("org.springframework.boot:spring-boot-starter-thymeleaf")
    implementation("org.springframework.boot:spring-boot-starter-quartz")
    implementation('org.springframework.boot:spring-boot-starter-amqp')
    implementation group: 'org.flywaydb', name: 'flyway-core', version: '6.5.2'
    implementation group: 'org.springframework.security', name: 'spring-security-messaging', version: '5.3.1.RELEASE'
    implementation group: 'org.springframework', name: 'spring-messaging', version: '5.2.5.RELEASE'
    implementation group: 'io.projectreactor.netty', name: 'reactor-netty', version: '0.9.6.RELEASE'
    implementation group: 'org.hibernate', name: 'hibernate-envers', version: '5.4.13.Final'
    implementation group: 'com.auth0', name: 'java-jwt', version: '3.10.2'
    implementation group: 'com.auth0', name: 'jwks-rsa', version: '0.11.0'
    implementation group: 'com.amazonaws', name: 'aws-java-sdk-s3', version: "${awsSdkVersion}"
    implementation group: 'org.xhtmlrenderer', name: 'flying-saucer-core', version: "${flyingSaucerRendererVersion}"
    implementation group: 'org.xhtmlrenderer', name: 'flying-saucer-pdf-itext5', version: "${flyingSaucerRendererVersion}"
    implementation group: 'net.sf.jtidy', name: 'jtidy', version: 'r938'
    implementation group: 'com.fasterxml.jackson.datatype', name: 'jackson-datatype-jsr310', version: '2.10.3'
    //Jackson Date Format Standard
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.10'
    implementation group: 'org.apache.commons', name: 'commons-collections4', version: '4.4'
    implementation group: 'commons-io', name: 'commons-io', version: '2.6'
    implementation group: 'org.json', name: 'json', version: '20190722'
    implementation group: 'org.postgresql', name: 'postgresql', version: '42.2.12'
    implementation group: 'mysql', name: 'mysql-connector-java', version: '5.1.44'
    implementation group: 'org.hashids', name: 'hashids', version: '1.0.3'
    implementation group: 'com.warrenstrange', name: 'googleauth', version: '1.4.0'
    implementation group: 'com.vladmihalcea', name: 'hibernate-types-52', version: '2.9.7'
    implementation group: 'com.univocity', name: 'univocity-parsers', version: '2.9.0'

    testImplementation('org.springframework.boot:spring-boot-starter-test')
    testImplementation group: 'org.assertj', name: 'assertj-core', version: '3.15.0'
    testImplementation group: 'com.auth0', name: 'java-jwt', version: '3.10.2'
    compile fileTree(include: ['utils-1.0-SNAPSHOT.jar'], dir: 'libs')
    compileOnly("org.projectlombok:lombok:${lombokVersion}")
    testCompileOnly("org.projectlombok:lombok:${lombokVersion}")
    annotationProcessor("org.projectlombok:lombok:${lombokVersion}")
    testAnnotationProcessor("org.projectlombok:lombok:${lombokVersion}")
}

test {
    if (project.hasProperty('exclude')) {
        exclude project.property('exclude')
    }
}

jacocoTestReport {
    reports {
        xml.enabled false
        csv.enabled false
        html.destination file("${buildDir}/jacocoHtml")
    }
    getClassDirectories().setFrom(classDirectories.files.collect {
        fileTree(dir: it, exclude: [
                'com/capacidad/validationapi/module/**/controller/**',
                'com/capacidad/validationapi/module/**/config/security/**',
                'com/capacidad/validationapi/module/**/dto/**',
                'com/capacidad/validationapi/module/**/reference/**',
                'com/capacidad/validationapi/module/**/repository/**',
                'com/capacidad/validationapi/module/**/model/**',
                'com/capacidad/validationapi/functional/**',
                'com/capacidad/validationapi/misc/ApplicationProperties.class',
                'com/capacidad/validationapi/misc/ApplicationContextProvider.class',
                'com/capacidad/validationapi/config/security/WebSecurityConfig.class',
                'com/capacidad/validationapi/config/security/WebSocketSecurityConfig.class',
                'com/capacidad/validationapi/config/security/WebSocketAuthentication.class',
                'com/capacidad/validationapi/config/security/JWTAuthenticationToken.class',
                'com/capacidad/validationapi/module/scheduler/**',
                'com/capacidad/validationapi/prescription/galbop/model/**'
        ])
    })
}