#Datasource
spring.datasource.initialization-mode=always
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=5
#JPA/Hibernate Properties
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
#Logging
logging.level.com.capacidad.validationapi=debug
#Flyway
spring.flyway.enabled=false
#Notification
com.capacidad.validationapi.notification-service.enabled=false
#Quartz
spring.quartz.enabled=false
#Prescription
com.capacidad.validationapi.prescription-synchronization.enabled=false
