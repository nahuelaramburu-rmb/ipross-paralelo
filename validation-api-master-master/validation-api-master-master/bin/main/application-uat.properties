#Datasource
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=15
#JPA/Hibernate Properties
spring.jpa.show-sql=true
spring.jpa.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=1500
#Task Executor
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=15
spring.task.execution.pool.queue-capacity=100
#Logging
logging.level.com.capacidad.validationapi=debug
#Notification
com.capacidad.validationapi.notification-service.enabled=true
#Prescription
com.capacidad.validationapi.prescription-synchronization.enabled=false