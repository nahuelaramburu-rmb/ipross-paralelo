spring.config.activate.on-profile=dev

# Database
DATABASE_NAME=identityservice
DATABASE_HOST=localhost
DATABASE_PORT=5432
DATABASE_USERNAME=postgres
DATABASE_PASSWORD=ramones16


#Datasource
#spring.datasource.url=jdbc:postgresql://localhost:5432/validationapitest
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.initialization-mode=always
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=15

#JPA/Hibernate Properties
spring.jpa.generate-ddl=true
#spring.jpa.hibernate.ddl-auto=update , se han cargado de forma manual las tablas de los modelos
spring.jpa.show-sql=true
spring.jpa.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=1500
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.ddl-auto=none

spring.jpa.properties.hibernate.id.new_generator_mappings=false
spring.jpa.properties.hibernate.id.optimizer.pooled.preferred=none



#server
server.port=${PORT:8080}

#Logging
logging.level.com.capacidad.identityservice=debug
logging.level.com.zaxxer.hikari.HikariConfig=debug
logging.level.com.zaxxer.hikari=trace
logging.level.org.springframework.security.oauth2.provider.token.store=error


#se requiere tener acceso de usuario para ver los endpoints en swagger,
# JSON de OpenAPI
springdoc.api-docs.path=/identity-service/v1/api-docs
# Swagger UI path
springdoc.swagger-ui.path=/identity-service/v1/swagger-ui

springdoc.swagger-ui.oauth.client-id=mi-client-id
springdoc.swagger-ui.oauth.client-secret=mi-client-secret
springdoc.swagger-ui.oauth.realm=mi-realm
springdoc.swagger-ui.oauth.app-name=identity-service
springdoc.swagger-ui.oauth.scopes=read,write

