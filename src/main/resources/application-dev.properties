#Datasource
#spring.datasource.url=jdbc:mysql://168.181.187.5:3306/ipross?
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}



useSSL=false&serverTimezone=UTC

spring.datasource.driver-class-name=org.postgresql.Driver
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


spring.datasource.initialization-mode=always
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=15

#JPA/Hibernate Properties
spring.jpa.generate-ddl=true
#spring.jpa.hibernate.ddl-auto=update , se han cargado de forma manual las tablas de los modelos !!
spring.jpa.show-sql=true
spring.jpa.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=1500
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.ddl-auto=none

spring.jpa.properties.hibernate.id.new_generator_mappings=false
spring.jpa.properties.hibernate.id.optimizer.pooled.preferred=none


#server
server.port=${PORT:8080}

#Logging
logging.level.com.capacidad.identityservice=debug
logging.level.com.zaxxer.hikari.HikariConfig=debug
logging.level.com.zaxxer.hikari=trace
logging.level.org.springframework.security.oauth2.provider.token.store=error


#flyway , desactivado , he creado en local las tablas de las entidades de este proyecto
spring.flyway.enabled=false


application.security.jwt.secret-key=a7bc9c2ee804b92d4ec81491cb4710a86c9118b98d102a6cd0ca5f065b317c61

# Expiración del access token: 1 hora = 60 * 60 * 1000 = 3600000 ms
