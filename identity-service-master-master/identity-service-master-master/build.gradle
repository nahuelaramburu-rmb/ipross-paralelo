buildscript {
    ext {
        lombokVersion = '1.18.8'
    }
}

plugins {
    id 'org.springframework.boot' version "2.2.1.RELEASE"
    id 'java'
    id 'idea'
    id 'jacoco'
    id "io.spring.dependency-management" version "1.0.8.RELEASE"
}

bootJar {
    archiveBaseName = 'identity-service'
    archiveVersion = '0.0.1-SNAPSHOT'
}

sourceCompatibility = '11'


repositories {
    mavenCentral()
}

configurations {
    // exclude Tomcat
    compile.exclude module: 'spring-boot-starter-tomcat'
}


dependencies {
    compile("org.springframework.boot:spring-boot-starter-web")
    compile("org.springframework.boot:spring-boot-starter-undertow")
    implementation('org.springframework.boot:spring-boot-starter-hateoas')
    implementation('org.springframework.boot:spring-boot-starter-data-jpa')
    implementation("org.springframework.boot:spring-boot-starter-security")
    implementation("org.springframework.boot:spring-boot-starter-actuator")
    implementation("org.springframework.boot:spring-boot-starter-mail")
    implementation("org.springframework.boot:spring-boot-starter-thymeleaf")
    implementation("org.springframework.boot:spring-boot-starter-data-redis")
    implementation group: 'org.springframework.security.oauth', name: 'spring-security-oauth2', version: '2.5.1.RELEASE'
    implementation group: 'org.springframework.security', name: 'spring-security-messaging', version: '5.2.1.RELEASE'
    implementation group: 'org.springframework', name: 'spring-messaging', version: '5.2.1.RELEASE'
    implementation('org.flywaydb:flyway-core')
    implementation group: 'org.apache.commons', name: 'commons-pool2', version: '2.6.2'
    implementation group: 'com.auth0', name: 'java-jwt', version: '3.13.0'
    implementation group: 'com.auth0', name: 'jwks-rsa', version: '0.15.0'
    implementation group: 'com.nimbusds', name: 'nimbus-jose-jwt', version: '9.5'
    implementation group: 'com.warrenstrange', name: 'googleauth', version: '1.5.0'
    implementation group: 'org.postgresql', name: 'postgresql', version: '42.2.5'
    implementation group: 'org.modelmapper', name: 'modelmapper', version: '2.3.5'
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.8.1'
    implementation group: 'org.json', name: 'json', version: '20180130'
    testImplementation('org.springframework.boot:spring-boot-starter-test')
    testImplementation group: 'org.assertj', name: 'assertj-core', version: '3.11.1'
    compile fileTree(include: ['utils-1.0-SNAPSHOT.jar'], dir: 'libs')
    compileOnly("org.projectlombok:lombok:${lombokVersion}")
    testCompileOnly("org.projectlombok:lombok:${lombokVersion}")
    annotationProcessor("org.projectlombok:lombok:${lombokVersion}")
    testAnnotationProcessor("org.projectlombok:lombok:${lombokVersion}")
}

jacocoTestReport {
    reports {
        xml.enabled false
        csv.enabled false
        html.destination file("${buildDir}/jacocoHtml")
    }
    getClassDirectories().setFrom(classDirectories.files.collect {
        fileTree(dir: it, exclude: [
                'com/capacidad/identityservice/config/oauth/BaseTokenServices.class',
                'com/capacidad/identityservice/config/security/**',
                'com/capacidad/identityservice/config/oauth/ExceptionTranslatorConfig**',
                'com/capacidad/identityservice/config/oauth/OAuthServerConfig**',
                'com/capacidad/identityservice/config/oauth/TokenStoreConfig**',
                'com/capacidad/identityservice/functional/**',
                'com/capacidad/identityservice/model/**',
                'com/capacidad/identityservice/exception/**',
                'com/capacidad/identityservice/repository/**',
                'com/capacidad/identityservice/service/impl/AuthenticatorImpl.class',
                'com/capacidad/identityservice/service/impl/EmailServiceImpl.class',
                'com/capacidad/identityservice/service/impl/CustomUserDetailsService.class',
                'com/capacidad/identityservice/service/impl/TemplateServiceImpl.class',
                'com/capacidad/identityservice/service/impl/NotificationServiceImpl.class',
                'com/capacidad/identityservice/specification/**',
                'com/capacidad/identityservice/repository/base/JpaSpecificationExecutorWithProjectionImpl.class'
        ])
    })
}